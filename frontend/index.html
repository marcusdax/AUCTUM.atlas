<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="RoofPro CRM - modern roofing contractor CRM with storm intelligence, scheduling and estimates that keep working in the field." />
    <title>RoofPro CRM</title>

    <!-- PWA: installable shell. The hand-written service worker (/sw.js) is registered in production only. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RoofPro" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.svg" sizes="180x180" />

    <!-- No external font requests are introduced by the PWA work; these hints only warm up -->
    <!-- the existing stylesheet origins (Leaflet CSS + the design-system fonts already in use). -->
    <link rel="preconnect" href="https://unpkg.com" crossorigin />

    <!-- ORBITAL INTELLIGENCE Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Leaflet CSS (preserved for storm tracking map) -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
