<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F1F2EA" />
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="AUCTUM ATLAS — storm intelligence and contractor CRM. Verified, from origin: storm briefs, map copilot, leads, jobs, estimates and field-ready scheduling."
    />
    <title>AUCTUM · ATLAS — Storm Intelligence</title>

    <!-- PWA: installable shell. The hand-written service worker (/sw.js) is registered in production only. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="AUCTUM" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.svg" sizes="180x180" />

    <!-- Existing stylesheet & tile/radar origins (Leaflet, OpenFreeMap, Esri, NEXRAD). -->
    <link rel="preconnect" href="https://unpkg.com" crossorigin />
    <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin />
    <link rel="preconnect" href="https://mesonet.agron.iastate.edu" crossorigin />
    <link rel="preconnect" href="https://server.arcgisonline.com" crossorigin />

    <!-- AUCTUM estate typography: Fraunces display · Archivo UI · IBM Plex Mono data -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    >

    <!-- Leaflet CSS (preserved for storm tracking map) -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
